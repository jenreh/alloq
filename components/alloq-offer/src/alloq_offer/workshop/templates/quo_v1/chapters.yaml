version: "quo_v1.0"
static_chapters:
  - rechtliche_bestimmungen
  - bindefrist
  - sonstiges
  - anlagen
  - unterschriften
chapters:
  - key: management_summary
    title: Management Summary
    level: 1
    required: true
    chapter_type: prose
    guiding_question: Welches Ziel verfolgt der Kunde, was bietet Arvato Systems an, und was ist der Rahmen (Umfang, Vorgehen, Annahmen)?
    content_rules:
      - Kurz und für Entscheider verständlich, keine technischen Details.
      - Nur Aussagen, die in Quellen oder der Story Map belegt sind.
  - key: leistungen
    title: Leistungen der Arvato Systems
    level: 1
    required: false
    chapter_type: prose
    guiding_question: Wie lässt sich der Leistungsumfang in zwei bis drei Sätzen einordnen?
    content_rules:
      - Einleitung zu den Unterkapiteln, ohne Wiederholung des Inhalts.
  - key: user_stories
    title: Angebotene User Stories
    level: 2
    required: true
    chapter_type: stories
    defaults:
      scopes: [angeboten, option]
      group_by: activity
    guiding_question: Welche Stories sind Teil des Angebots?
    content_rules:
      - Wird aus der Story Map aufgelöst, nie als Freitext gepflegt.
  - key: loesung
    title: Angebotene Lösung
    level: 2
    required: true
    chapter_type: prose
    guiding_question: Wie sieht die Lösung fachlich und technisch aus?
    content_rules:
      - Lösungsvorschläge als Vorschlag kennzeichnen, nicht als Kundenanforderung.
  - key: leistungsumfang
    title: Leistungsumfang
    level: 2
    required: true
    chapter_type: prose
    guiding_question: Welche Leistungen sind enthalten, welche ausdrücklich nicht?
    content_rules:
      - Ausgeschlossenes und optionale Leistungen getrennt benennen.
  - key: mitwirkung
    title: Mitwirkungspflichten des Auftraggebers
    level: 2
    required: true
    chapter_type: table
    defaults:
      columns: [Mitwirkung, Verantwortlich, Zeitpunkt]
    guiding_question: Was muss der Auftraggeber wann bereitstellen oder entscheiden?
    content_rules:
      - Jede Zeile nennt Verantwortlichen und Zeitpunkt.
  - key: rahmenbedingungen
    title: Rahmenbedingungen
    level: 2
    required: false
    chapter_type: prose
    guiding_question: Welche Annahmen und Randbedingungen gelten für das Angebot?
    content_rules:
      - Annahmen als Annahmen kennzeichnen.
  - key: projektabwicklung
    title: Projektabwicklung
    level: 1
    required: false
    chapter_type: prose
    guiding_question: Wie wird das Projekt organisiert und gesteuert?
    content_rules:
      - Organisation, Kommunikation, Meilensteine und Qualitätssicherung nennen.
  - key: laufzeit
    title: Laufzeit
    level: 1
    required: true
    chapter_type: prose
    guiding_question: Wann beginnt das Projekt und wie lange dauert es?
    content_rules:
      - Zeiträume nur nennen, wenn sie in Quellen oder Kalkulation belegt sind.
  - key: verguetung
    title: Vergütung
    level: 1
    required: true
    chapter_type: calc
    defaults:
      rows:
        - {label: Personentage, field: offer.person_days}
        - {label: Risikopuffer (Personentage), field: offer.risk_buffer_days}
        - {label: Herstellkosten, field: offer.production_cost}
        - {label: Empfohlener Preis, field: offer.recommended_price}
    guiding_question: Wie setzt sich die Vergütung zusammen?
    content_rules:
      - Zahlen kommen ausschließlich aus der bestätigten Kalkulation.
  - key: annahmen_risiken
    title: Annahmen und Risiken
    level: 1
    required: false
    chapter_type: prose
    guiding_question: Welche Annahmen und Risiken sind für den Kunden relevant?
    content_rules:
      - Nur kundenrelevante Punkte, keine interne Bewertung.
