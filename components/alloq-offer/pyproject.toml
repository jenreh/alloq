[project]
name = "alloq-offer"
version = "2.1.2"
description = "Offer management component for Alloq, a Reflex.dev based app for offer calculation for customer projects"
authors = [{ name = "Jens Rehpöhler", email = "jens.rehpoehler@bertelsmann.de" }]
requires-python = ">=3.14"
dependencies = [
    "alloq-commons",
    "docxtpl>=0.20.2",
    "pydantic-ai-slim[openai]>=2.60.0",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
knai-common = { workspace = true }
knowledgeai-commons-ui = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/alloq_offer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
