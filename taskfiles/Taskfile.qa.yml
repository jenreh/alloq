# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

silent: true

vars:
  RUNNER: uv run

tasks:
  # ----------------------------------------------------------------------------
  # Quality Assurance (Tests, Lint, Format)
  # ----------------------------------------------------------------------------

  test:
    desc: Run pytest with coverage
    cmd: "{{.RUNNER}} pytest --cov"

  typecheck:
    desc: Run ty type checking
    cmd: "{{.RUNNER}} ty check"

  format:
    desc: Format code with ruff
    cmds:
      - "{{.RUNNER}} ruff check --fix ."
      - "{{.RUNNER}} ruff format ."

  lint:
    desc: Run linting with ruff
    cmds:
      - task: format
      - task: typecheck

  pre-commit:
    desc: Run all pre-commit hooks (incl. betterleaks) on every file
    cmd: "{{.RUNNER}} pre-commit run --all-files"

  audit:
    desc: Check the locked dependencies for known vulnerabilities
    cmd: uv audit --frozen

  betterleaks:
    desc: Scan the git history of branches and tags for leaked secrets
    # Same scope as CI: a plain run also walks local refs/entire and refs/agents.
    cmd: betterleaks git --no-banner --redact --verbose --log-opts="--branches --tags"
