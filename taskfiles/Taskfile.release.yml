# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

silent: true

vars:
  RUNNER: uv run

tasks:
  default:
    desc: Show available commands
    cmd: task --list

  # ----------------------------------------------------------------------------
  # Release Commands
  # ----------------------------------------------------------------------------

  build:
    desc: |
      Usage: task release:build -- [major|minor|patch], defaults to 'patch'.
      Bumps version, commits, and creates a GitHub release.
    cmds:
      - uvx bump-my-version bump {{.CLI_ARGS | default "patch"}}
      - uv sync
      - git add -A
      - 'git diff --cached --quiet || git commit -m "chore: release v$(grep ''^version = '' pyproject.toml | cut -d ''"'' -f2)"'
      - git push
      - git fetch --tags --quiet
      - |
        version=$(grep '^version = ' pyproject.toml | cut -d '"' -f2)
        bash scripts/release_notes.sh | gh release create "v$version" --notes-file - --generate-notes
