name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: uv audit (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"

      - name: Audit uv.lock against known vulnerabilities
        run: uv audit --frozen

  secrets:
    name: betterleaks (git history)
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_VERSION: "1.9.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install betterleaks
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/${tarball}" -O "${base}/checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" betterleaks
          sudo install betterleaks /usr/local/bin/betterleaks

      - name: Scan repository for secrets
        run: betterleaks git --no-banner --redact --verbose
