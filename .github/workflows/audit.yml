name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - components/*/pyproject.toml
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: uv audit (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"

      - name: Audit uv.lock against known vulnerabilities
        run: uv audit --frozen
