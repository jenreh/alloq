name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    env:
      # Importing `app` loads the YAML configuration; the local profile plus
      # dummy secrets let it resolve without a real database or OAuth app.
      PROFILES: local
      SECRET_PROVIDER: local
      MN_DB_USER: postgres
      MN_DB_PASSWORD: postgres
      MN_DB_HOST: localhost
      MN_DB_NAME: alloq
      AVUI_OAUTH_GITHUB_CLIENT_ID: ci
      AVUI_OAUTH_GITHUB_CLIENT_SECRET: ci
      AVUI_OAUTH_AZURE_CLIENT_ID: ci
      AVUI_OAUTH_AZURE_CLIENT_SECRET: ci
      AVUI_OAUTH_AZURE_TENANT_ID: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Generate throwaway DB encryption key
        run: |
          key="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "::add-mask::${key}"
          echo "AVUI_DB_ENCRYPTION_KEY=${key}" >> "$GITHUB_ENV"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q

  javascript:
    name: Test (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --test
        run: node --test "components/*/tests/js/*.test.mjs"
