[project]
name = "Alloq"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "alloq-commons",
    "alloq-dashboard",
    "alloq-project",
    "alloq-team",
    "appkit-user==1.15.0",
    "appkit-mantine==1.15.0",
    "appkit-commons==1.15.0",
    "appkit-ui==1.15.0",
    "psycopg[binary,pool]==3.3.6",
    "reflex==0.9.12",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "bump-my-version==1.5.1",
    "detect-secrets==1.5.0",
    "faker==40.39.0",
    "pre-commit==4.6.2",
    "pytest_asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
where = [
    "components/alloq-dashboard/src",
    "components/alloq-project/src",
    "components/alloq-team/src",
    "components/alloq-commons/src",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
cache-dir = ".cache/uv_cache"

[tool.uv.workspace]
members = ["components/*"]
exclude = ["**/__pycache__"]

[tool.uv.sources]
alloq-commons = { workspace = true }
alloq-dashboard = { workspace = true }
alloq-project = { workspace = true }
alloq-team = { workspace = true }
# for **PRODUCTION** builds comment out the following lines to use published versions
# uncomment for local development to use the local versions of the appkit components
#appkit-mantine = { path = "../appkit/components/appkit-mantine", editable = true }
#appkit-user = { path = "../appkit/components/appkit-user", editable = true }
#appkit-commons = { path = "../appkit/components/appkit-commons", editable = true }
#appkit-ui = { path = "../appkit/components/appkit-ui", editable = true }


[tool.bumpversion]
commit = false
current_version = "0.2.0"
tag = false
allow-dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "configuration/config.yaml"
search = 'version: {current_version}'
replace = 'version: {new_version}'

[[tool.bumpversion.files]]
filename = "components/alloq-commons/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "components/alloq-dashboard/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "components/alloq-project/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "components/alloq-team/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.ruff]
cache-dir = ".cache/ruff"
indent-width = 4
line-length = 88
target-version = "py312"
extend-exclude = [
    ".cache",
    ".devcontainer",
    ".github",
    ".vscode",
    ".web",
    "build",
    "dist",
    "docs",
    "infra",
    "prompts",
    "scripts",
    "static",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "EM101",
    "EM102",
    "ISC001",
    "N811",
    "N818",
    "PLR0913",
    "PT011",
    "PT012",
    "RUF012",
    "RUF100",
    "SIM300",
    "E501",
    "B008",
    "ASYNC240",
    "PYI034",
    "S101",
    "PLR0912",
    "ASYNC109",
    "ARG001",
    "PLR2004",
    "PLW0603",
    "PLC0415",
    "SIM105",
    "PLW2901",
    "PLR0911",
    "B017",
    "RUF001",
    "RUF002",
    "RUF003",
]
select = [
    "A",
    "ANN001",
    "ANN201",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "EM",
    "EXE",
    "F",
    "FIX",
    "G",
    "ICN",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLF001",
    "T20",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "S101",
    "PLR2004",
    "ANN001",
    "S106",
    "SLF001",
    "RET504",
    "PERF401",
    "E402",
    "S501",
    "S110",
    "ARG002",
    "ARG005",
    "E741",
    "RUF059",
] # {name} imported but unused
"server.py" = ["W605", "S104"] # invalid escape sequence
"test_**.py" = ["S101", "PLR2004", "ANN001", "S106", "SLF001", "RET504", "PERF401"]
"alembic/versions/*.py" = ["E501"]
"indexer/main.py" = ["S104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
exclude = ["*.pyi"]

[tool.ruff.lint.isort]
known-local-folder = ["app", "alembic", "alloq-commons", "alloq-dashboard", "alloq-project", "alloq-team"]
known-first-party = ["appkit_*"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests", "components/alloq-commons/tests", "components/alloq-project/tests"]
import_mode = "importlib"
asyncio_mode = "auto"

# Type checking with `ty` (Astral). Run via `task typecheck` (uv run ty check).
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    ".agents",
    ".cache",
    ".claude",
    ".venv",
    "build",
    "dist",
]

# Treat unresolved third-party imports as errors-off-by-default like mypy's
# ignore_missing_imports; ty resolves imports from the project venv instead.
[tool.ty.rules]
unresolved-import = "warn"

# runic.ogm Field() descriptors are annotated with their value type (str, list),
# so class-level query expressions (R.mela_id.in_(...)) look untyped to ty.
[[tool.ty.overrides]]
include = ["mela_graph/adapters/graph/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"

[tool.coverage.run]
branch = true
source = ["mela_graph"]
omit = []

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "pragma: no cover", "^\\s*\\.\\.\\.$"]
fail_under = 80
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
