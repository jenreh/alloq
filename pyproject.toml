[project]
name = "Alloq"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "alloq-commons",
    "alloq-dashboard",
    "alloq-project",
    "alloq-team",
    "appkit-user==1.16.0",
    "appkit-mantine==1.16.0",
    "appkit-commons[azure]==1.16.0",
    "appkit-ui==1.16.0",
    "psycopg[binary,pool]==3.3.6",
    "reflex==0.9.12",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "bump-my-version==1.5.1",
    "detect-secrets==1.5.0",
    "faker==40.40.0",
    "pre-commit==4.6.2",
    "pytest_asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
cache-dir = ".cache/uv_cache"
# Security floors for transitive deps (Dependabot #13-#31); raise, never remove
constraint-dependencies = [
    "anyio>=4.14.2",
    "oauthlib>=4.0.0",
    "python-engineio>=4.13.2",
    "python-socketio>=5.16.2",
    "urllib3>=2.8.0",
    "virtualenv>=21.7.13",
]

[tool.uv.workspace]
members = ["components/*"]
exclude = ["**/__pycache__"]

[tool.uv.sources]
alloq-commons = { workspace = true }
alloq-dashboard = { workspace = true }
alloq-project = { workspace = true }
alloq-team = { workspace = true }
# for **PRODUCTION** builds comment out the following lines to use published versions
# uncomment for local development to use the local versions of the appkit components
#appkit-mantine = { path = "../appkit/components/appkit-mantine", editable = true }
#appkit-user = { path = "../appkit/components/appkit-user", editable = true }
#appkit-commons = { path = "../appkit/components/appkit-commons", editable = true }
#appkit-ui = { path = "../appkit/components/appkit-ui", editable = true }


[tool.bumpversion]
commit = false
current_version = "0.4.0"
tag = false
allow-dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "configuration/config.yaml"
search = 'version: {current_version}'
replace = 'version: {new_version}'

[[tool.bumpversion.files]]
filename = "components/alloq-commons/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "components/alloq-dashboard/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "components/alloq-project/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "components/alloq-team/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.ruff]
cache-dir = ".cache/ruff"
indent-width = 4
line-length = 88
target-version = "py314"
extend-exclude = [
    ".agents",
    ".cache",
    ".claude",
    ".codex",
    ".devcontainer",
    ".github",
    ".vscode",
    ".web",
    "build",
    "dist",
    "docs",
    "infra",
    "prompts",
    "scripts",
    "static",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "EM101", # Exception must not use a string literal
    "EM102", # Exception must not use a string literal with a format specifier
    "ISC001", # Implicit string concatenation
    "N811", # Constant {name} imported as non-constant {asname}
    "N818", # Exception name {name} should be named with an Error suffix
    "PLR0913", # Too many arguments in function
    "PT011", # pytest-raises-too-broad
    "PT012", # pytest.raises() block should contain a single simple statement
    "RUF012", # Mutable class attributes should be annotated with typing.ClassVar
    "RUF100", # unused noqa
    "SIM300", # Yoda conditions are discouraged, use {suggestion} instead
]
select = [
    "A", # Flake8-builtins
    "ANN001",
    "ANN201", # Missing return type annotation
    "ARG", # Flake8-arguments
    "ASYNC", # Flake8-async
    "B", # Flake8-bugbear
    "C4", # Flake8-comprehensions
    "DTZ", # Flake8-datetimez
    "E", # Pyflakes
    "EM", # Flake8-errmsg
    "EXE", # Flake8-executable
    "F", # Pyflakes
    "FIX", # Flake8-fixme
    "FAST", # FastAPI
    "G", # Flake8-logging-format
    "ICN", # Flake8-import-conventions
    "LOG", # Flake8-logging
    "N", # Naming
    "PERF", # Perflint
    "PIE", # Flake8-pie
    "PL", # PyLint
    "PT", # Flake8-pytest-style
    "PTH", # Flake8-use-pathlib
    "PYI", # Flake8-pyi
    "Q", # Flake8-quotes
    "RET", # Flake8-return
    "RUF", # Ruff
    "S", # Flake8-bandit
    "SIM", # Flake8-simplify
    "SLF", # Flake8-self
    "SLF001", # Flake8-self
    "T20", # Flake8-print
    "TID", # Flake8-tidy-imports
    "UP", # PyUpgrade - will show hints for deprecated syntax in python 3.11
    "W", # pycodestyle
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"] # {name} imported but unused
"server.py" = ["W605", "S104"] # invalid escape sequence
"test_**.py" = ["S101", "PLR2004", "ANN001", "S106", "SLF001", "RET504", "PERF401"]
"alembic/versions/*.py" = ["E501"]
"indexer/main.py" = ["S104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
exclude = ["*.pyi"]

[tool.ruff.lint.isort]
known-local-folder = ["app", "alembic"]
known-first-party = ["appkit_*"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = [
    "tests",
    "components/alloq-commons/tests",
    "components/alloq-dashboard/tests",
    "components/alloq-project/tests",
    "components/alloq-team/tests",
]
import_mode = "importlib"
asyncio_mode = "auto"

# Type checking with `ty` (Astral). Run via `task typecheck` (uv run ty check).
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    ".agents",
    ".cache",
    ".claude",
    ".venv",
    ".venv.mac",
    ".web",
    "build",
    "dist",
]

# Treat unresolved third-party imports as errors-off-by-default like mypy's
# ignore_missing_imports; ty resolves imports from the project venv instead.
[tool.ty.rules]
unresolved-import = "warn"

[tool.coverage.run]
branch = true
omit = []
source = [
    "app",
    "components/alloq-commons/src/alloq_commons",
    "components/alloq-dashboard/src/alloq_dashboard",
    "components/alloq-project/src/alloq_project",
    "components/alloq-team/src/alloq_team",
]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "pragma: no cover", "^\\s*\\.\\.\\.$"]
fail_under = 80
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
