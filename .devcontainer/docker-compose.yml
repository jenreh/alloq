services:
  app:
    container_name: alloq-dev
    image: alloq/ui-dev
    build:
      # The Dockerfile copies nothing, so only send this folder as build context
      context: .
      dockerfile: Dockerfile
      args:
        VARIANT: 3.14-bookworm
    volumes:
      - ../..:/workspaces:rw,cached
      # Survives rebuilds: uv, pre-commit and antidote caches, uv-managed Python and
      # tools, Claude Code and Copilot login and plugins (symlinked, see Dockerfile)
      - dev-state:/home/vscode/.persist
    command: sleep infinity
    networks:
      - alloq-network

  db:
    container_name: alloq-db
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: alloq-db
      POSTGRES_PASSWORD: postgres
    ports:
      - 5433:5432
    networks:
      - alloq-network

volumes:
  postgres-data:
    name: alloq-postgres-data
  dev-state:
    name: alloq-dev-state

networks:
  alloq-network:
    driver: bridge
