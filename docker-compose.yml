services:
  alloq-app:
    container_name: alloq-app
    image: alloq
    build:
      context: .
      dockerfile: Dockerfile
    # Optional local overrides (gitignored). It must provide the Fernet key:
    #   MN_DB_ENCRYPTION_KEY=<python -c "from cryptography.fernet import Fernet;
    #                          print(Fernet.generate_key().decode())">
    env_file:
      - path: .env.docker
        required: false
    depends_on:
      - db
    # Put the app into the same network as the DB so it can reach the DB at host 'db'
    networks:
      - alloq-network
    # Profile docker_test points the app at host 'db' / database 'alloq-db';
    # the credentials below match the db service.
    environment:
      - PROFILES=docker_test
      - SECRET_PROVIDER=local
      - MN_DB_USER=postgres
      - MN_DB_PASSWORD=postgres
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /reflexapp/app
        - action: sync
          path: ./components
          target: /reflexapp/components
        - action: sync
          path: ./assets
          target: /reflexapp/assets
        - action: sync
          path: ./configuration
          target: /reflexapp/configuration
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./start.sh

  db:
    container_name: alloq-db
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: alloq-db
      POSTGRES_PASSWORD: postgres
    ports:
      - 5433:5432
    networks:
      - alloq-network

volumes:
  postgres-data:
    name: alloq-postgres-data
networks:
  alloq-network:
    driver: bridge
