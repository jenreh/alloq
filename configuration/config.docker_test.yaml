profile: docker_test

reflex:
  deploy_url: http://localhost:8080
  frontend_port: 8080
  backend_port: 3030
  workers: 3
  default_timeout: 300 # seconds
  backend_timeout: 300 # seconds

app:
  environment: docker

  database:
    host: db
    name: alloq-db

  authentication:
    server_url: http://localhost
    server_port: 8080

    # Lists replace (not merge) the config.yaml list: the local compose stack
    # has no OAuth secrets, so no providers are configured.
    oauth_providers: []
