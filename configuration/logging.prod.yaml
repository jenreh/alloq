version: 1
disable_existing_loggers: False
formatters:
  generic:
    format: "%(asctime)s %(levelname)-8s: %(name)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: generic
    stream: ext://sys.stdout

loggers:
  root:
    level: INFO
    handlers: [console]
    propagate: 0
  rxconfig:
    level: DEBUG
    handlers: [console]
    propagate: 0
  app:
    level: INFO
    handlers: [console]
    propagate: 0
  server:
    level: INFO
    handlers: [console]
    propagate: 0
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: 0
  azure.core.pipeline.policies.http_logging_policy:
    level: WARNING
    handlers: [console]
    propagate: 0
  alembic.autogenerate.compare:
    level: WARNING
    handlers: [console]
    propagate: 0
