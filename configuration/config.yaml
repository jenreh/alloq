profile: default

reflex:
  deploy_url: http://localhost
  # No frontend_port here: it would stop `reflex run --backend-only`. Profiles
  # that serve the frontend set it; production passes REFLEX_FRONTEND_PORT.
  backend_port: 3030
  workers: 2
  frontend_path: /alloq

app:
  version: 0.4.0
  name: Alloq
  logging: logging.prod.yaml
  environment: production
  backend_timeout: 180 # seconds
  # Reverse-proxy addresses allowed to set X-Forwarded-Proto (unset: trust all)
  # trusted_proxies: ["10.0.0.4"]

  database:
    username: secret:mn-db-user
    password: secret:mn-db-password
    host: secret:mn-db-host
    port: 5432
    name: secret:mn-db-name
    encryption_key: secret:avui-db-encryption-key
    pool_size: 10 # change only when needed
    max_overflow: 30 # change only when needed
    echo: False # Set to True to enable SQL logging

  authentication:
    session_timeout: 25 # minutes
    auth_token_refresh_delta: 10 # minutes
    # server_url/server_port have no default on purpose: production must provide
    # the public address via APP__AUTHENTICATION__SERVER_URL and
    # APP__AUTHENTICATION__SERVER_PORT (e.g. 443); profiles set their own.

    # OAuth callback URLs are derived from server_url and server_port.
    oauth_providers:
      - provider: "github"
        client_id: secret:avui-oauth-github-client-id
        client_secret: secret:avui-oauth-github-client-secret
      - provider: "azure"
        client_id: secret:avui-oauth-azure-client-id
        client_secret: secret:avui-oauth-azure-client-secret
        tenant_id: secret:avui-oauth-azure-tenant-id
