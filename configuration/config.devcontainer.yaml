profile: devcontainer

reflex:
  frontend_port: 8080

app:
  environment: devcontainer
  logging: logging.yaml

  database:
    username: postgres
    password: postgres
    host: db
    port: 5432
    echo: False
    name: alloq-db

  authentication:
    session_cookie_secure: false # plain http, reached by hostname
    email_provider:
      provider: mock
      from_name: Alloq
