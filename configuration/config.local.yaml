profile: local

reflex:
  deploy_url: http://localhost
  frontend_port: 8080

app:
  environment: local
  logging: logging.yaml

  database:
    echo: False

  authentication:
    server_url: http://localhost:8080

    # Replaces the provider list from config.yaml (lists are overwritten, not
    # merged): local dev has no azure secrets, so only github is configured.
    oauth_providers:
      - provider: "github"
        client_id: secret:mn-oauth-github-client-id
        client_secret: secret:mn-oauth-github-client-secret
        redirect_url: http://localhost:8080/oauth/github/callback
