[package]
name = "alloq"
version = "0.4.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# >>> reflex-desktop plugins >>>
# <<< reflex-desktop plugins <<<
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api: transparent window for the native sidebar vibrancy.
tauri = { version = "2", features = ["macos-private-api"] }

# Native About panel with a clickable link (NSAttributedString credits).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSColor",
    "NSImage",
    "NSImageRep",
    "NSFont",
    "NSText",
    "NSAttributedString",
    "NSParagraphStyle",
] }
objc2-foundation = { version = "0.3", features = [
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSRange",
    "NSString",
    "NSURL",
    "NSValue",
    "NSObject",
] }

[[bin]]
name = "alloq"
path = "src/main.rs"
