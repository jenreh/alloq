[package]
name = "alloq"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# >>> reflex-desktop plugins >>>
# <<< reflex-desktop plugins <<<
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api: transparent window for the native sidebar vibrancy.
tauri = { version = "2", features = ["macos-private-api"] }

[[bin]]
name = "alloq"
path = "src/main.rs"
